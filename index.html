const Metric = ({ label, value, sub, subColor }) => (
  <div style={{ textAlign: "right" }}>

    <div style={{ fontSize: 18, fontWeight: 800 }}>{value}</div>
    <div style={{ fontSize: 11, color: subColor, fontWeight: 600 }}>{sub}</div>

    {[{ w: 50, k: "0" }, { w: 20, k: "0,3" }, { w: 30, k: "0,7" }, { w: 20, k: "1" }, { w: 20, k: "1,2" }].map((s, i) => (
      <div key={i} style={{ width: `${(s.w / 140) * 100}%`, borderRight: i < 4 ? "2px solid #fff" : "none", background: ["#EDEFEC", "#FBF1DF", "#FCE8D9", "#E3F0ED", "#CFE8E2"][i] }} />
    ))}
    <div style={{
      position: "absolute", left: `${Math.min(pct, 140) / 1.4}%`, top: -3, width: 4, height: 16,
      background: C.ink, borderRadius: 2, transform: "translateX(-2px)",
    }} />
  </div>
);

function FarmhubCrmMopDash() {
  const [period, setPeriod] = useState("month");
  const [acts, setActs] = useState(initialActs);

  const cur = acts[period];
  const total = cur.reduce((s, a) => s + premiumOf(a), 0);
  const totalAt100 = cur.reduce((s, a) => s + Math.round(a.plan * a.price * 1), 0);

  const bump = (id, dir) =>
    setActs((p) => ({
      ...p,
      [period]: p[period].map((a) => (a.id === id ? { ...a, fact: Math.max(0, a.fact + dir * a.step) } : a)),
    }));

  // «Что добить»: для каждой активности — расстояние до следующего порога и прирост премии
  const hints = cur
    .map((a) => {
      const pct = (a.fact / a.plan) * 100;
      const tier = tierOf(pct);
      if (tier.to === Infinity) return null;
      const needFact = Math.ceil((tier.to / 100) * a.plan) - a.fact;
      const newPremium = Math.round(((tier.to / 100) * a.plan) * a.price * tierOf(tier.to).k);
      const gain = newPremium - premiumOf(a);
      return { name: a.name, needFact, unit: a.unit, nextK: tierOf(tier.to).k, gain, perUnit: Math.round(gain / Math.max(needFact, 1)) };
    })
    .filter(Boolean)
    .sort((x, y) => y.perUnit - x.perUnit);

  const periodLabel = period === "month" ? "июнь" : "Q2";
  const periodPart = period === "month" ? 33 : 42; // % периода прошло

  return (
    <div style={{ fontFamily: "'Manrope','Inter',system-ui,sans-serif", background: C.bg, minHeight: "100vh", color: C.ink, fontSize: 13 }}>
      {/* Шапка */}
      <div style={{ background: C.surface, borderBottom: `1px solid ${C.line}`, padding: "14px 22px", display: "flex", alignItems: "center", gap: 16, flexWrap: "wrap" }}>
        <div>
          <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
            <span style={{ fontSize: 19, fontWeight: 800 }}>Моя премия · {periodLabel}</span>
            <div style={{ display: "flex", gap: 4 }}>
              {[["month", "месяц"], ["quarter", "квартал"]].map(([k, l]) => (
                <button key={k} onClick={() => setPeriod(k)}
                  style={{
                    border: `1px solid ${period === k ? C.green : C.line}`, background: period === k ? C.green : C.surface,
                    color: period === k ? "#fff" : C.ink, borderRadius: 6, padding: "5px 12px", fontSize: 12, fontWeight: 700, cursor: "pointer",
                  }}>{l}</button>
              ))}
            </div>
          </div>
          <div style={{ color: C.inkSoft, marginTop: 3 }}>Левина Светлана · алгоритм премии: июнь (задан РОПом) · прошло {periodPart}% периода</div>
        </div>
        <div style={{ marginLeft: "auto", display: "flex", gap: 26, alignItems: "center" }}>
          <div style={{ textAlign: "right" }}>
            <div style={{ fontSize: 10, fontWeight: 700, letterSpacing: "0.08em", textTransform: "uppercase", color: C.grey }}>Премия сейчас</div>
            <div style={{ fontSize: 26, fontWeight: 800, color: C.green }}>{total.toLocaleString("ru-RU")} ₽</div>
          </div>
          <div style={{ textAlign: "right" }}>
            <div style={{ fontSize: 10, fontWeight: 700, letterSpacing: "0.08em", textTransform: "uppercase", color: C.grey }}>При 100% по всем</div>
            <div style={{ fontSize: 18, fontWeight: 800, color: C.inkSoft }}>{totalAt100.toLocaleString("ru-RU")} ₽</div>
          </div>
        </div>
      </div>

      <div style={{ display: "grid", gridTemplateColumns: "1fr 320px", gap: 14, padding: 14, alignItems: "start" }}>
        {/* Таблица активностей */}
        <Card>
          <SectionTitle right={<span style={{ fontSize: 11, color: C.grey }}>кнопки +/− — симулятор «что если»</span>}>
            Активности → коэффициент → премия
          </SectionTitle>
          {cur.map((a, i) => {
            const pct = Math.round((a.fact / a.plan) * 100);
            const tier = tierOf(pct);
            const prem = premiumOf(a);
            const toNext = tier.to === Infinity ? null : Math.ceil((tier.to / 100) * a.plan) - a.fact;
            return (
              <div key={a.id} style={{ borderTop: i ? `1px solid ${C.line}` : "none", padding: "12px 0" }}>
                <div style={{ display: "flex", alignItems: "center", gap: 10, flexWrap: "wrap" }}>
                  <div style={{ flex: 1, minWidth: 220 }}>
                    <div style={{ fontWeight: 800 }}>{a.name}</div>
                    <div style={{ fontSize: 11, color: C.grey }}>
                      {a.pct ? "ставка: 1% от суммы заказа × k" : `цена единицы: ${a.price} ₽`}
                    </div>
                  </div>
                  <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
                    <SimBtn onClick={() => bump(a.id, -1)}>−</SimBtn>
                    <div style={{ minWidth: 86, textAlign: "center", fontWeight: 800 }}>
                      {a.fact.toLocaleString("ru-RU")} / {a.plan.toLocaleString("ru-RU")}
                    </div>
                    <SimBtn onClick={() => bump(a.id, 1)}>+</SimBtn>
                  </div>
                  <div style={{ width: 64, textAlign: "right", fontWeight: 800, color: pct >= 100 ? C.green : pct >= 70 ? C.amber : C.red }}>{pct}%</div>
                  <Badge bg={tier.k >= 1 ? C.greenSoft : tier.k > 0 ? C.amberSoft : C.redSoft} color={tier.k >= 1 ? C.green : tier.k > 0 ? C.amber : C.red}>
                    k = {String(tier.k).replace(".", ",")}
                  </Badge>
                  <div style={{ width: 92, textAlign: "right", fontWeight: 800 }}>{prem.toLocaleString("ru-RU")} ₽</div>
                </div>
                <div style={{ marginTop: 8 }}>
                  <TierLadder pct={pct} />
                  <div style={{ display: "flex", justifyContent: "space-between", fontSize: 10, color: C.grey, marginTop: 3 }}>
                    <span>0</span><span>50%</span><span>70%</span><span>100%</span><span>120%</span><span>140%+</span>
                  </div>
                </div>
                {toNext !== null && toNext > 0 && (
                  <div style={{ fontSize: 12, color: C.inkSoft, marginTop: 5 }}>
                    До k = {String(tierOf(tier.to).k).replace(".", ",")} осталось{" "}
                    <b style={{ color: C.ink }}>{toNext.toLocaleString("ru-RU")} {a.unit}</b>
                  </div>
                )}
              </div>
            );
          })}
        </Card>

        {/* Правая колонка */}
        <div style={{ display: "grid", gap: 12 }}>
          <Card style={{ background: C.greenSoft, border: "1px solid #CBE2DC" }}>
            <SectionTitle>Что добить в первую очередь</SectionTitle>
            <div style={{ fontSize: 11, color: C.inkSoft, marginBottom: 8 }}>Сортировка: максимум премии за единицу усилия до ближайшего порога.</div>
            {hints.slice(0, 3).map((h, i) => (
              <div key={i} style={{ padding: "8px 0", borderTop: i ? "1px solid #CBE2DC" : "none" }}>
                <div style={{ fontWeight: 800, fontSize: 12 }}>{h.name}</div>
                <div style={{ fontSize: 12, color: C.inkSoft, marginTop: 2 }}>
                  +{h.needFact.toLocaleString("ru-RU")} {h.unit} → k = {String(h.nextK).replace(".", ",")} →{" "}
                  <b style={{ color: C.green }}>+{h.gain.toLocaleString("ru-RU")} ₽</b>
                  <span style={{ color: C.grey }}> ({h.perUnit.toLocaleString("ru-RU")} ₽/ед.)</span>
                </div>
              </div>
            ))}
          </Card>

          <Card>
            <SectionTitle>Шкала коэффициентов · июнь</SectionTitle>
            {TIERS.map((t, i) => (
              <div key={i} style={{ display: "flex", justifyContent: "space-between", padding: "5px 0", borderTop: i ? `1px solid ${C.line}` : "none", fontSize: 12 }}>
                <span style={{ color: C.inkSoft }}>
                  {t.to === Infinity ? `от ${t.from}%` : `${t.from}% – ${t.to}%`}
                </span>
                <b style={{ color: t.k >= 1 ? C.green : t.k > 0 ? C.amber : C.red }}>k = {String(t.k).replace(".", ",")}</b>
              </div>
            ))}
            <div style={{ fontSize: 11, color: C.grey, marginTop: 8 }}>
              Алгоритм задаётся на месяц, в разные месяцы квартала может отличаться. Источник: настройки РОПа/админа.
            </div>
          </Card>

          <Card>
            <SectionTitle>Премия по месяцам</SectionTitle>
            <div style={{ display: "flex", alignItems: "flex-end", gap: 10, height: 90, padding: "4px 2px" }}>
              {[...monthHistory, { m: "Июнь*", v: total }].map((b, i) => {
                const max = Math.max(...monthHistory.map((x) => x.v), total);
                const isNow = i === 3;
                return (
                  <div key={i} style={{ flex: 1, display: "flex", flexDirection: "column", alignItems: "center", gap: 4 }}>
                    <div style={{ fontSize: 10, fontWeight: 700, color: isNow ? C.green : C.inkSoft }}>
                      {Math.round(b.v / 1000)}т
                    </div>
                    <div style={{
                      width: "100%", height: `${(b.v / max) * 60}px`, borderRadius: "4px 4px 0 0",
                      background: isNow ? C.green : "#CFD6D1",
                    }} />
                    <div style={{ fontSize: 10, color: C.grey }}>{b.m}</div>
                  </div>
                );
              })}
            </div>
            <div style={{ fontSize: 10, color: C.grey }}>* июнь — текущее значение, не прогноз</div>
          </Card>
        </div>
      </div>
    </div>
  );
}

      width: 26, height: 26, border: `1px solid ${C.line}`, background: C.surface, color: C.ink,
      borderRadius: 6, fontWeight: 900, fontSize: 14, cursor: "pointer", lineHeight: 1,
    }}>

  </button>
);

return FarmhubCrmMopDash;
})();
